
{% load static %}

<header class="navbar">

    <div class="container-custom navbar-container">

        <!-- LOGO -->
        <a href="{% url 'home' %}" class="logo">

    <img
        src="{% static 'images/logo/logo.png' %}"
        alt="LINO"
        class="logo-image">

</a>

        <!-- DESKTOP NAVIGATION -->
        <nav class="navbar-nav">

            <ul class="nav-menu">

                <li>
                    <a href="{% url 'home' %}"
                       class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                       title="Home">
                        <i class="fa-solid fa-house"></i>
                    </a>
                </li>

                <li>
                    <a href="{% url 'collections' %}"
                       class="nav-link {% if request.resolver_match.url_name == 'collections' %}active{% endif %}"
                       title="Collections">
                        <i class="fa-solid fa-spray-can-sparkles"></i>
                    </a>
                </li>

                <li>
                    <a href="{% url 'wishlist' %}"
                       class="nav-link wishlist-nav"
                       title="Wishlist">

                        <i class="fa-regular fa-heart"></i>

                        <span class="wishlist-count">0</span>

                    </a>
                </li>

                <li>
                    <a href="{% url 'cart' %}"
                       class="nav-link cart-nav"
                       title="Cart">

                        <i class="fa-solid fa-bag-shopping"></i>

                        <span class="cart-count">0</span>

                    </a>
                </li>

                {% if request.user.is_authenticated %}
                <li>
                    <a href="{% url 'profile' %}"
                       class="nav-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}"
                       title="Profile ({{ request.user.first_name|default:request.user.username }})">
                        <i class="fa-solid fa-user"></i>
                    </a>
                </li>
                {% else %}
                <li>
                    <a href="javascript:void(0)"
                       onclick="openAuthModal('profile', '{% url 'profile' %}', 'login')"
                       class="nav-link {% if request.resolver_match.url_name == 'login' %}active{% endif %}"
                       title="Sign In / Register">
                        <i class="fa-regular fa-user"></i>
                    </a>
                </li>
                {% endif %}

            </ul>

        </nav>

        <!-- MOBILE ACTIONS -->

        <div class="mobile-right">

            <div class="mobile-actions">

        <a href="{% url 'cart' %}" class="mobile-action cart-btn">
            <i class="fa-solid fa-bag-shopping"></i>
            <span class="cart-count">0</span>
        </a>

    </div>

    <button
        class="menu-toggle"
        type="button"
        aria-label="Open Menu"
        aria-expanded="false"
        aria-controls="mobile-menu">

        <i class="fa-solid fa-bars"></i>

    </button>

</div>

    </div>

</header>

<!-- MOBILE OVERLAY -->

<div class="mobile-menu-overlay"></div>

<!-- MOBILE DRAWER -->

<aside
    class="mobile-menu"
    id="mobile-menu">

    <div class="mobile-menu-header">

        <button
            class="mobile-close"
            type="button"
            aria-label="Close Menu">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>

    <nav class="mobile-nav">

        <a href="{% url 'home' %}"
           class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">

            <i class="fa-solid fa-house"></i>

            <span>Home</span>

        </a>

        <a href="{% url 'collections' %}"
           class="{% if request.resolver_match.url_name == 'collections' %}active{% endif %}">

            <i class="fa-solid fa-spray-can-sparkles"></i>

            <span>Collections</span>

        </a>

        <a href="{% url 'wishlist' %}">

            <i class="fa-regular fa-heart"></i>

            <span>Wishlist</span>

        </a>

        <a href="{% url 'cart' %}">

            <i class="fa-solid fa-bag-shopping"></i>

            <span>Cart</span>

        </a>

        {% if request.user.is_authenticated %}
        <a href="{% url 'profile' %}"
           class="{% if request.resolver_match.url_name == 'profile' %}active{% endif %}">

            <i class="fa-solid fa-user"></i>

            <span>My Profile</span>

        </a>

        <a href="{% url 'my_orders' %}">

            <i class="fa-solid fa-box"></i>

            <span>My Orders</span>

        </a>

        <a href="{% url 'logout' %}">

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>Sign Out</span>

        </a>
        {% else %}
        <a href="javascript:void(0)" onclick="openAuthModal('profile', '{% url 'profile' %}', 'login')">

            <i class="fa-solid fa-right-to-bracket"></i>

            <span>Sign In</span>

        </a>

        <a href="javascript:void(0)" onclick="openAuthModal('profile', '{% url 'profile' %}', 'register')">

            <i class="fa-solid fa-user-plus"></i>

            <span>Create Account</span>

        </a>
        {% endif %}

    </nav>

</aside>
