{% extends "admin/base.html" %}
{% load static %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | LINO PARFUMS Admin{% endblock %}

{% block extrahead %}
{{ block.super }}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{% static 'css/admin_theme.css' %}">
{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}" class="admin-brand-link">
        <img src="{% static 'images/logo/lino-logo-white.png' %}" alt="LINO" class="admin-logo-img">
        <span class="admin-brand-tag">ADMIN PORTAL</span>
    </a>
</div>
{% endblock %}

{% block nav-global %}{% endblock %}
